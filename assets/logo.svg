<?xml version="1.0" encoding="UTF-8"?>
<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Soft Trading Skill logo">
  <defs>
    <linearGradient id="g" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>
  <!-- faint circular background -->
  <circle cx="60" cy="60" r="56" fill="url(#g)" fill-opacity="0.08"/>
  <!-- candlestick bars -->
  <rect x="28" y="54" width="6" height="18" rx="1" fill="#0b1220" />
  <rect x="42" y="48" width="6" height="24" rx="1" fill="#0b1220" />
  <rect x="56" y="38" width="6" height="34" rx="1" fill="#0b1220" />
  <rect x="70" y="46" width="6" height="26" rx="1" fill="#0b1220" />
  <!-- upward price line shaped like an S with arrow -->
  <path d="M24 78 C40 64, 52 64, 64 74 C76 84, 90 64, 104 50" fill="none" stroke="url(#g)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- arrow head -->
  <path d="M102 46 L110 54 L98 56 Z" fill="url(#g)"/>
</svg>
